name: Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app and sync Capacitor
        run: npm run cap:sync

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"
            cat > "$GITHUB_WORKSPACE/android/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo 'Android release signing is configured.'
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo 'Android signing secrets are not configured; only the installable Debug APK will be produced.'
          fi

      - name: Build installable Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed Release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taget-debug-apk-${{ github.sha }}
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed Release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taget-release-apk-aab-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Build summary
        run: |
          echo 'Installable Debug APK: download taget-debug-apk from this workflow run.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            echo 'Signed Release APK and AAB were generated.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Release APK/AAB were skipped because Android signing Secrets are missing.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to enable them.' >> "$GITHUB_STEP_SUMMARY"
          fi
