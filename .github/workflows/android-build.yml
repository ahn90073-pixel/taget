name: Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'test/android_oauth_signing_test.py'
      - 'FIREBASE_GOOGLE_SIGNIN.md'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android artifacts
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install web dependencies
        run: npm ci

      - name: Validate Firebase client configuration
        run: |
          if [ ! -s android/app/google-services.json ]; then
            echo 'android/app/google-services.json is required for Firebase.'
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('android/app/google-services.json').read_text())
          package_names = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])]
          if 'com.taget.app' not in package_names:
              raise SystemExit(f'google-services.json does not contain com.taget.app: {package_names}')
          project_id = data.get('project_info', {}).get('project_id')
          if project_id != 'tager-z':
              print(f'Detected Firebase project_id (public identifier): {project_id}')
              raise SystemExit('google-services.json project_id must match the backend Firebase project configured for this app.')
          client = next((c for c in data.get('client', []) if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.taget.app'), None)
          oauth_clients = client.get('oauth_client', []) if client else []
          has_android_oauth = any(o.get('client_type') == 1 and o.get('android_info', {}).get('package_name') == 'com.taget.app' and o.get('android_info', {}).get('certificate_hash') for o in oauth_clients)
          has_web_oauth = any(o.get('client_type') == 3 and o.get('client_id') for o in oauth_clients)
          if not has_android_oauth or not has_web_oauth:
              raise SystemExit('google-services.json must include Android and Web OAuth clients for Google Sign-In.')
          print('Firebase google-services.json validated for com.taget.app, the backend project, and Google OAuth clients.')
          PY

      - name: Validate release tag matches Android version
        if: github.event_name == 'release'
        run: |
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -1)
          expected_tag="v${version_name}"
          if [ -z "$version_name" ] || [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME must match Android versionName (expected $expected_tag)."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME matches Android versionName $version_name."

      - name: Test Android OAuth signing validation
        run: python3 -m unittest discover -s test -p '*_test.py'

      - name: Build web app and sync Capacitor
        run: npm run cap:sync

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"
            cat > "$GITHUB_WORKSPACE/android/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo 'Android release signing is configured.'
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo 'Android signing secrets are not configured; only the installable Debug APK will be produced.'
          fi

      - name: Require Release signing for GitHub Releases
        if: github.event_name == 'release' && steps.signing.outputs.configured != 'true'
        run: |
          echo 'Cannot publish an Android GitHub Release without the configured Release keystore.'
          exit 1

      - name: Build installable Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK Google Sign-In certificate
        id: debug-oauth
        run: |
          debug_sha1="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}')"
          if [ -z "$debug_sha1" ]; then
            echo 'Could not read the Debug APK signing certificate.'
            exit 1
          fi
          python3 scripts/validate_android_oauth_signing.py \
            --firebase-config android/app/google-services.json \
            --package-name com.taget.app \
            --sha1 "$debug_sha1" \
            --mode debug \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload installable Debug APK
        if: steps.debug-oauth.outputs.matches == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taget-debug-apk-${{ github.sha }}
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed Release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify Release APK Google Sign-In certificate
        if: steps.signing.outputs.configured == 'true'
        id: release-oauth
        run: |
          release_sha1="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}')"
          if [ -z "$release_sha1" ]; then
            echo 'Could not read the Release APK signing certificate.'
            exit 1
          fi
          python3 scripts/validate_android_oauth_signing.py \
            --firebase-config android/app/google-services.json \
            --package-name com.taget.app \
            --sha1 "$release_sha1" \
            --mode release \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload signed Release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taget-release-apk-aab-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Build summary
        run: |
          if [ "${{ steps.debug-oauth.outputs.matches }}" = "true" ]; then
            echo 'Google Sign-In compatible Debug APK: download taget-debug-apk from this workflow run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Debug APK was not uploaded: its signing SHA-1 is not registered in Firebase, so Google Sign-In would fail. Use the validated Release APK or register a stable Debug certificate.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Debug APK SHA-1: ${{ steps.debug-oauth.outputs.sha1 }}' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            echo 'Signed Release APK and AAB were generated and the Release APK SHA-1 was validated against Firebase.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Release APK/AAB were skipped because Android signing Secrets are missing.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to enable them.' >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.debug-oauth.outputs.matches }}" != "true" ]; then
              echo 'No Google Sign-In-compatible installable APK was produced.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

  publish-github-release:
    name: Attach validated Android files to GitHub Release
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Release APK and AAB
        uses: actions/download-artifact@v4
        with:
          name: taget-release-apk-aab-${{ github.sha }}
          path: release-assets

      - name: Attach APK and AAB to the matching versioned Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test -s release-assets/apk/release/app-release.apk
          test -s release-assets/bundle/release/app-release.aab
          gh release upload "$RELEASE_TAG" \
            "release-assets/apk/release/app-release.apk#tager-${version}-release.apk" \
            "release-assets/bundle/release/app-release.aab#tager-${version}-release.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
