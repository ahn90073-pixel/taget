name: iOS IPA and Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS production artifacts
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app and sync Capacitor
        run: npm run build && npx cap copy ios

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Configure Apple signing
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$IOS_TEAM_ID" ] && [ -n "$IOS_BUNDLE_ID" ] && [ -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/taget-build.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print:UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
            cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "team=$IOS_TEAM_ID" >> "$GITHUB_OUTPUT"
            echo "bundle=$IOS_BUNDLE_ID" >> "$GITHUB_OUTPUT"
            echo "profile=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
            echo 'Apple signing is configured.'
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo 'Apple signing secrets are not configured; building an unsigned archive for validation.'
          fi

      - name: Build unsigned iOS archive
        if: steps.signing.outputs.configured != 'true'
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/Taget.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build signed iOS archive
        if: steps.signing.outputs.configured == 'true'
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/Taget.xcarchive" \
            DEVELOPMENT_TEAM="${{ steps.signing.outputs.team }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ steps.signing.outputs.bundle }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile }}" \
            CODE_SIGN_STYLE=Manual

      - name: Export signed IPA
        if: steps.signing.outputs.configured == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Taget.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$PWD/build/export"

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: taget-ios-archive-${{ github.sha }}
          if-no-files-found: error
          path: build/Taget.xcarchive

      - name: Upload signed IPA
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taget-ios-ipa-${{ github.sha }}
          if-no-files-found: error
          path: build/export/*.ipa

      - name: Build summary
        run: |
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            echo 'Signed IPA and XCArchive were generated.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unsigned XCArchive was generated. Add Apple signing secrets to export an installable IPA.' >> "$GITHUB_STEP_SUMMARY"
          fi
